# ═══════════════════════════════════════════════════════════════
# docker-compose.prod.yml — Production deployment for Universal iDRAC Console
# Usage: docker compose -f docker-compose.prod.yml up -d
# TLS termination via nginx, no exposed internal ports.
# ═══════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL 16 ──
  postgres:
    image: postgres:16-alpine
    container_name: idrac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-idrac}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - idrac-internal

  # ── Redis 7 ──
  redis:
    image: redis:7-alpine
    container_name: idrac-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - idrac-internal

  # ── NestJS API ──
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: production
    container_name: idrac-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-idrac}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - idrac-internal

  # ── Next.js Frontend ──
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: production
    container_name: idrac-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_CONSOLE_URL: ${NEXT_PUBLIC_CONSOLE_URL}
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - idrac-internal

  # ── Console Gateway ──
  console-gw:
    build:
      context: .
      dockerfile: docker/console-gw.Dockerfile
      target: production
    container_name: idrac-console-gw
    restart: unless-stopped
    environment:
      NODE_ENV: production
      IDRAC_CONSOLE_IMAGE: ${IDRAC_CONSOLE_IMAGE:-universal-idrac-console:legacy}
      CONSOLE_IDLE_TIMEOUT: ${CONSOLE_IDLE_TIMEOUT:-1800}
      CONSOLE_MAX_PER_TENANT: ${CONSOLE_MAX_PER_TENANT:-10}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - idrac-internal

  # ── Nginx Reverse Proxy ──
  nginx:
    image: nginx:1.27-alpine
    container_name: idrac-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl.conf:/etc/nginx/ssl.conf:ro
      - ${TLS_CERT_PATH:-./nginx/certs/fullchain.pem}:/etc/nginx/certs/fullchain.pem:ro
      - ${TLS_KEY_PATH:-./nginx/certs/privkey.pem}:/etc/nginx/certs/privkey.pem:ro
    depends_on:
      - web
      - api
      - console-gw
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - idrac-internal

volumes:
  postgres-data:
  redis-data:

networks:
  idrac-internal:
    driver: bridge
    internal: false
