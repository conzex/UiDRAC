# ═══════════════════════════════════════════════════════════════
# docker-compose.prod.yml — Production deployment for Universal iDRAC Console
# Usage: docker compose -f docker-compose.prod.yml up -d
# Conzex product — uidrac.cloud.conzex.com (includes edge agent)
# TLS termination via nginx, no exposed internal ports.
# ═══════════════════════════════════════════════════════════════

name: uidrac

services:
  # ── PostgreSQL 16 ──
  u-postgres:
    image: postgres:16-alpine
    container_name: u-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-idrac}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - u-net

  # ── Redis 7 ──
  u-redis:
    image: redis:7-alpine
    container_name: u-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - u-net

  # ── NestJS API (with edge-agent support) ──
  u-api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: production
    container_name: u-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@u-postgres:5432/${POSTGRES_DB:-idrac}
      REDIS_URL: redis://u-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-selfhosted}
      REQUIRE_EDGE_AGENT: ${REQUIRE_EDGE_AGENT:-false}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      AGENT_SIGNING_SECRET: ${AGENT_SIGNING_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    depends_on:
      u-postgres:
        condition: service_healthy
      u-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - u-net

  # ── Next.js Frontend ──
  u-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: production
    container_name: u-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_UPSTREAM: http://u-api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_CONSOLE_URL: ${NEXT_PUBLIC_CONSOLE_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      - u-api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - u-net

  # ── Console Gateway ──
  u-console-gw:
    build:
      context: .
      dockerfile: docker/console-gw.Dockerfile
      target: production
    container_name: u-console-gw
    restart: unless-stopped
    environment:
      NODE_ENV: production
      IDRAC_CONSOLE_IMAGE: ${IDRAC_CONSOLE_IMAGE:-uidrac:legacy}
      CONSOLE_IDLE_TIMEOUT: ${CONSOLE_IDLE_TIMEOUT:-1800}
      CONSOLE_MAX_PER_TENANT: ${CONSOLE_MAX_PER_TENANT:-10}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - u-api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - u-net

  # ── Nginx Reverse Proxy ──
  u-nginx:
    image: nginx:1.27-alpine
    container_name: u-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl.conf:/etc/nginx/ssl.conf:ro
      - ${TLS_CERT_PATH:-./nginx/certs/fullchain.pem}:/etc/nginx/certs/fullchain.pem:ro
      - ${TLS_KEY_PATH:-./nginx/certs/privkey.pem}:/etc/nginx/certs/privkey.pem:ro
    depends_on:
      - u-web
      - u-api
      - u-console-gw
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - u-net

volumes:
  postgres-data:
  redis-data:

networks:
  u-net:
    driver: bridge
    internal: false
