# ═══════════════════════════════════════════════════════════════
# docker-compose.yml — Development environment for Universal iDRAC Console
# Usage: docker compose up -d
# Conzex product — uidrac.cloud.conzex.com (includes edge agent)
# ═══════════════════════════════════════════════════════════════

name: uidrac

services:
  # ── PostgreSQL 16 ──
  u-postgres:
    image: postgres:16-alpine
    container_name: u-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idrac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-idrac}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idrac}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - u-net

  # ── Redis 7 ──
  u-redis:
    image: redis:7-alpine
    container_name: u-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - u-net

  # ── NestJS API (with edge-agent support) ──
  u-api:
    image: node:20-alpine
    container_name: u-api
    restart: unless-stopped
    working_dir: /app
    ports:
      - "4000:4000"
    command:
      - sh
      - -c
      - |
        export COREPACK_HOME=/corepack-cache
        cd /app
        /app/node_modules/.pnpm/prisma@5.22.0/node_modules/prisma/build/index.js generate --schema=packages/db/prisma/schema.prisma 2>/dev/null || true
        /app/node_modules/.pnpm/prisma@5.22.0/node_modules/prisma/build/index.js db push --schema=packages/db/prisma/schema.prisma --skip-generate --accept-data-loss 2>/dev/null || true
        node -r /app/node_modules/.pnpm/@swc+register@0.1.10_@swc+core@1.16.2/node_modules/@swc/register/lib/index.js apps/api/src/main.ts
    environment:
      NODE_ENV: development
      PRISMA_QUERY_ENGINE_LIBRARY: /app/packages/db/generated/client/libquery_engine-linux-musl-arm64-openssl-3.0.x.so.node
      POSTGRES_URL: postgresql://${POSTGRES_USER:-idrac}:${POSTGRES_PASSWORD:-devpassword}@u-postgres:5432/${POSTGRES_DB:-idrac}
      REDIS_URL: redis://u-redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      REFRESH_SECRET: ${REFRESH_SECRET:-dev-refresh-secret-change-in-production}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-cloud}
      REQUIRE_EDGE_AGENT: ${REQUIRE_EDGE_AGENT:-true}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      AGENT_SIGNING_SECRET: ${AGENT_SIGNING_SECRET:-${JWT_SECRET:-dev-agent-signing}}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    volumes:
      - .:/app
      - ~/.cache/node/corepack:/corepack-cache:ro
    depends_on:
      u-postgres:
        condition: service_healthy
      u-redis:
        condition: service_healthy
    networks:
      - u-net

  # ── Next.js Frontend ──
  u-web:
    image: node:20-alpine
    container_name: u-web
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    command:
      - sh
      - -c
      - |
        cd /app/apps/web && node ../../node_modules/.pnpm/next@14.2.35_react-dom@18.3.1_react@18.3.1__react@18.3.1/node_modules/next/dist/bin/next dev -p 3000 -H 0.0.0.0
    environment:
      NODE_ENV: development
      API_UPSTREAM: http://u-api:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_CONSOLE_URL: http://localhost:6080/console
    volumes:
      - .:/app
    depends_on:
      - u-api
    networks:
      - u-net

  # ── Console Gateway ──
  u-console-gw:
    image: node:20-alpine
    container_name: u-console-gw
    restart: unless-stopped
    working_dir: /app
    ports:
      - "6080:6080"
    command:
      - sh
      - -c
      - |
        export COREPACK_HOME=/corepack-cache
        cd /app && node -r /app/node_modules/.pnpm/@swc+register@0.1.10_@swc+core@1.16.2/node_modules/@swc/register/lib/index.js apps/console-gw/src/index.ts
    environment:
      NODE_ENV: development
      IDRAC_CONSOLE_IMAGE: ${IDRAC_CONSOLE_IMAGE:-uidrac:legacy}
      CONSOLE_IDLE_TIMEOUT: ${CONSOLE_IDLE_TIMEOUT:-1800}
      CONSOLE_MAX_PER_TENANT: ${CONSOLE_MAX_PER_TENANT:-10}
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.cache/node/corepack:/corepack-cache:ro
    depends_on:
      - u-api
    networks:
      - u-net

volumes:
  postgres-data:
  redis-data:

networks:
  u-net:
    driver: bridge
