# ═══════════════════════════════════════════════════════════════
# docker-compose.yml — Development environment for Universal iDRAC Console
# Usage: docker compose up -d
# All services with hot reload enabled for development.
# ═══════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL 16 ──
  postgres:
    image: postgres:16-alpine
    container_name: idrac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idrac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-idrac}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idrac}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - idrac-net

  # ── Redis 7 ──
  redis:
    image: redis:7-alpine
    container_name: idrac-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - idrac-net

  # ── NestJS API ──
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: development
    container_name: idrac-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      POSTGRES_URL: postgresql://${POSTGRES_USER:-idrac}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-idrac}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      REFRESH_SECRET: ${REFRESH_SECRET:-dev-refresh-secret-change-in-production}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - idrac-net

  # ── Next.js Frontend ──
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: development
    container_name: idrac-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_CONSOLE_URL: http://localhost:6080/console
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages:/app/packages
    depends_on:
      - api
    networks:
      - idrac-net

  # ── Console Gateway ──
  console-gw:
    build:
      context: .
      dockerfile: docker/console-gw.Dockerfile
    container_name: idrac-console-gw
    restart: unless-stopped
    ports:
      - "6080:6080"
    environment:
      NODE_ENV: development
      IDRAC_CONSOLE_IMAGE: ${IDRAC_CONSOLE_IMAGE:-universal-idrac-console:legacy}
      CONSOLE_IDLE_TIMEOUT: ${CONSOLE_IDLE_TIMEOUT:-1800}
      CONSOLE_MAX_PER_TENANT: ${CONSOLE_MAX_PER_TENANT:-10}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./apps/console-gw/src:/app/apps/console-gw/src
    depends_on:
      - api
    networks:
      - idrac-net

volumes:
  postgres-data:
  redis-data:

networks:
  idrac-net:
    driver: bridge
