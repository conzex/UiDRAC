# Optional Cloudflare Tunnel sidecar (uses host network → 127.0.0.1:443)
# Usage:
#   Set CLOUDFLARE_TUNNEL_TOKEN in .env (from Zero Trust → Tunnels → Install connector)
#   docker compose -f docker-compose.prod.yml -f docker-compose.cloudflare.yml up -d
#
# Requires production stack already binding host ports 80/443 (nginx service).

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: uidrac-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    network_mode: host
    depends_on:
      - nginx
